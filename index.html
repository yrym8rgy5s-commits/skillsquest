<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152f"><title>SkillsQuest</title><style>
*{box-sizing:border-box}body{margin:0;background:#07152f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:24px 18px 90px;min-height:100vh}.brand{font-size:28px;font-weight:800}.hero{padding:42px 0 24px}.hero h1{font-size:40px;line-height:1.08;margin:10px 0}.muted{color:#aebbd4}.card,.track{background:#102347;border:1px solid #29466d;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.track{cursor:pointer;min-height:110px}.track b{display:block;margin:8px 0}.input{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #345176;background:#091a37;color:#fff}.btn{border:0;border-radius:12px;padding:14px 18px;background:#4f8cff;color:#fff;font-weight:700}.btn.alt{background:#20395f}.full{width:100%;margin-top:10px}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#19365f;color:#c5d9ff;font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;background:#081a36;border-top:1px solid #294064;display:flex;justify-content:center;gap:30px;padding:12px}.nav button{background:none;border:0;color:#b8c5db}.nav .active{color:#fff;font-weight:700}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border-radius:12px;border:1px solid #345176;background:#10284d;color:#fff}.score{font-size:44px;font-weight:800}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:36px}}</style></head><body><div id="app" class="app"></div><div id="nav" class="nav" style="display:none"></div>
<script>
const T=[
["AI","🤖","AI Product / Automation Analyst",[["What is generative AI used for?",["Create new text, images or code","Repair hardware","Manage payroll","Install Wi-Fi"],0],["What improves an AI prompt?",["Clear context and desired output","More office chairs","A longer password","A larger monitor"],0],["Before using company data in AI, check its...",["Privacy and security rules","Lunch menu","Printer ink","Desk size"],0],["An AI project should be assessed by its...",["Business value","Logo","Slide count","Office location"],0],["A good automation candidate is a...",["Repetitive rule-based task","Sensitive judgement call","Team celebration","Personal conversation"],0]]],
["Cybersecurity","🔐","Cybersecurity Analyst",[["MFA provides...",["More than one identity check","Faster internet","More storage","Better graphics"],0],["A suspected incident should be...",["Reported through the response process","Posted online","Ignored","Deleted"],0],["Security updates can...",["Fix known vulnerabilities","Increase screen brightness","Reduce meetings","Change job titles"],0],["A common cyber risk is...",["Phishing","Office plants","Calendar colours","Desk height"],0],["Security awareness includes...",["Spotting suspicious links","Sharing passwords","Disabling MFA","Reusing passwords"],0]]],
["Data Analytics","📊","Data Analyst",[["A common spreadsheet analysis tool is...",["Excel","Paint","Music Player","Calendar"],0],["SQL is commonly used to...",["Query data","Design posters","Record video","Book rooms"],0],["Missing data matters because it can...",["Affect analysis accuracy","Improve Wi-Fi","Create passwords","Change fonts"],0],["A dashboard helps people...",["See key metrics visually","Repair laptops","Approve leave","Encrypt files"],0],["Good data visualisation should...",["Make patterns easier to understand","Hide unusual results","Avoid labels","Use every chart type"],0]]],
["Cloud","☁️","Cloud Support / Cloud Analyst",[["Cloud computing provides...",["Computing resources over a network","Paper records","Only offline software","Only physical storage"],0],["A cloud outage investigation can start with...",["Status, logs and connectivity","Deleting the project","Ignoring alerts","Changing passwords"],0],["Monitoring helps teams track...",["System health and performance","Birthdays","Office furniture","Business cards"],0],["Networking knowledge explains...",["How systems communicate","How to cook","How to print","How to travel"],0],["Cloud automation can...",["Reduce repetitive manual work","Remove security controls","Skip testing","Hide errors"],0]]],
["Project Management","📋","Project Coordinator / Manager",[["A project manager coordinates...",["Scope, time, resources and stakeholders","Every line of code","Office catering","All leave requests"],0],["When a task is delayed, first...",["Assess impact and update the plan","Hide it","Cancel everything","Blame someone"],0],["Stakeholder management means...",["Understanding needs and communicating","Avoiding stakeholders","Only sending invoices","Choosing furniture"],0],["A project risk is...",["An uncertain event affecting objectives","A completed task","A meeting room","A job title"],0],["Clear project communication keeps teams...",["Aligned on progress and actions","Confused","Without documentation","Without accountability"],0]]],
["Human Resources","👥","HR / Talent Management Specialist",[["A core HR responsibility is...",["Supporting people and workforce processes","Building servers","Repairing routers","Auditing code"],0],["People analytics helps HR...",["Understand workforce trends","Replace interviews","Create passwords","Design logos"],0],["Talent management can include...",["Development and succession planning","Only payroll printing","Office cleaning","Hardware repair"],0],["Employee development focuses on...",["Building skills and capabilities","Reducing all training","Deleting feedback","Avoiding career talks"],0],["Effective HR communication should be...",["Clear, respectful and audience-appropriate","Secretive","Identical in every case","Only verbal"],0]]],
["Finance","💰","Financial Analyst",[["Financial analysis involves...",["Interpreting financial data for decisions","Designing websites","Repairing laptops","Planning parties"],0],["A budget helps an organisation...",["Plan and control income and spending","Guarantee profit","Avoid every cost","Remove reporting"],0],["Profit is broadly...",["Revenue minus costs","Costs minus revenue","Revenue plus costs","Assets minus employees"],0],["Excel is useful in finance for...",["Calculations and modelling","Replacing accounting standards","Managing Wi-Fi","Making security badges"],0],["Cost comparison should consider...",["Relevant costs and expected benefits","Only the biggest number","Only the oldest price","Office colour"],0]]],
["Sustainability","🌱","Sustainability Analyst",[["ESG stands for...",["Environmental, Social and Governance","Employee Sales Growth","Economic Software Guide","Energy Systems Group"],0],["A sustainability KPI helps...",["Measure progress against an objective","Replace financial KPIs","Choose furniture","Set passwords"],0],["Sustainability reporting can...",["Communicate performance and progress","Avoid measurement","Remove accountability","Stop data collection"],0],["Data analysis supports sustainability by...",["Finding resource and emissions trends","Deleting records","Replacing policies","Removing targets"],0],["Resource efficiency means...",["Achieving outcomes with less waste","Using more resources","Avoiding measurement","Buying the most expensive option"],0]]],
["Entrepreneurship","🚀","Business / Startup Associate",[["A strong business idea starts with...",["A real customer problem","A logo","An office","A company name"],0],["Market research helps founders...",["Understand customers and competitors","Guarantee success","Avoid customers","Set passwords"],0],["A business model explains...",["How a business creates and captures value","Only its logo","Only its location","Only social media"],0],["A pitch should communicate...",["Problem, solution, value and evidence","Only biography","Only logo","Only history"],0],["Validation means...",["Testing assumptions with market evidence","Assuming agreement","Skipping research","Avoiding feedback"],0]]],
["Career & Leadership","⭐","Leadership / Learning Specialist",[["Good leadership includes...",["Setting direction and supporting people","Doing everything alone","Avoiding feedback","Keeping goals unclear"],0],["Constructive feedback should be...",["Specific, respectful and actionable","Personal and vague","Delayed forever","Only negative"],0],["Coaching mainly means...",["Helping someone develop through support","Giving every answer","Avoiding goals","Replacing training"],0],["Facilitation helps a group...",["Work toward a clear outcome","Avoid discussion","Choose randomly","Skip decisions"],0],["Engagement can improve when people...",["Understand purpose and can contribute","Never get feedback","Have unclear expectations","Avoid communication"],0]]]
];
let s={user:localStorage.getItem("sq_user")||"",page:"home",track:0,q:0,score:0,answered:false};
const app=()=>document.getElementById("app");
function esc(x){return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function nav(){let n=document.getElementById("nav");n.style.display=s.user?"flex":"none";if(s.user)n.innerHTML='<button onclick="home()" class="'+(s.page=="home"?"active":"")+'">Home</button><button onclick="explore()" class="'+(s.page=="explore"?"active":"")+'">Explore</button><button onclick="profile()" class="'+(s.page=="profile"?"active":"")+'">Profile</button>'}
function render(){nav();if(!s.user)return auth();if(s.page=="home")home();else if(s.page=="explore")explore();else if(s.page=="profile")profile();else if(s.page=="track")track();else quiz()}
function auth(){app().innerHTML='<div class="hero"><div class="brand">⚡ SkillsQuest</div><h1>Build skills.<br>Find your career.</h1><p class="muted">A gamified IBM SkillsBuild onboarding sprint.</p></div><div class="card"><h2>Get started</h2><input id="name" class="input" placeholder="Your name"><input class="input" placeholder="Email"><input class="input" type="password" placeholder="Password"><button class="btn full" onclick="signup()">Create account</button><button class="btn alt full" onclick="signin()">Sign in</button></div>'}
function signup(){let x=document.getElementById("name").value.trim();if(!x)return alert("Please enter your name.");s.user=x;localStorage.setItem("sq_user",x);render()}
function signin(){let x=document.getElementById("name").value.trim()||"SkillsQuest User";s.user=x;localStorage.setItem("sq_user",x);render()}
function home(){s.page="home";app().innerHTML='<div class="hero"><span class="pill">Welcome, '+esc(s.user)+'</span><h1>Build skills.<br>Find your career.</h1><p class="muted">Explore a career track, complete a 5-question sprint and earn XP.</p><button class="btn" onclick="explore()">Explore tracks →</button></div><div class="card"><b>⚡ Your mission</b><p class="muted">Discover roles and practise skills employers value.</p></div><h2>Career tracks</h2><div class="grid">'+T.slice(0,4).map(card).join("")+'</div>'}
function explore(){s.page="explore";app().innerHTML='<h1>Explore tracks</h1><p class="muted">10 career pathways.</p><div class="grid">'+T.map(card).join("")+'</div>';nav()}
function card(t,i){return '<div class="track" onclick="openTrack('+i+')"><span style="font-size:28px">'+t[1]+'</span><b>'+t[0]+'</b><span class="muted">'+t[2]+'</span></div>'}
function openTrack(i){s.track=i;s.page="track";render()}
function track(){let t=T[s.track];app().innerHTML='<button class="btn alt" onclick="explore()">← Back</button><div class="hero"><span style="font-size:42px">'+t[1]+'</span><h1>'+t[0]+'</h1><p class="muted">'+t[2]+'</p></div><div class="card"><span class="pill">Career role</span><h2>'+t[2]+'</h2><p class="muted">Complete 5 questions tailored to '+t[0]+'.</p><button class="btn full" onclick="start()">Start sprint →</button></div>'}
function start(){s.q=0;s.score=0;s.answered=false;s.page="quiz";quiz()}
function quiz(){let t=T[s.track],q=t[3][s.q];app().innerHTML='<div class="card"><span class="pill">Question '+(s.q+1)+' of 5</span><h2>'+q[0]+'</h2>'+q[1].map((x,i)=>'<button class="option" onclick="answer('+i+')">'+x+'</button>').join("")+'</div>'}
function answer(i){if(s.answered)return;s.answered=true;let q=T[s.track][3][s.q];if(i===q[2])s.score++;setTimeout(()=>{s.q++;s.answered=false;if(s.q<5)quiz();else finish()},250)}
function finish(){app().innerHTML='<div class="hero"><span class="pill">Sprint complete</span><h1>Great work, '+esc(s.user)+'!</h1><div class="score">'+s.score+'/5</div><p>You earned <b>'+(s.score*50)+' XP</b>.</p><button class="btn full" onclick="explore()">Try another track</button><button class="btn alt full" onclick="profile()">View profile</button></div>'}
function profile(){s.page="profile";app().innerHTML='<h1>Profile</h1><div class="card"><span class="pill">SkillsQuest learner</span><h2>'+esc(s.user)+'</h2><p class="muted">⚡ 250 XP demo balance</p><p>🏅 Explorer · First Sprint</p><button class="btn alt full" onclick="logout()">Sign out</button></div>'}
function logout(){s.user="";localStorage.removeItem("sq_user");s.page="home";render()}
window.home=home;window.explore=explore;window.profile=profile;window.signup=signup;window.signin=signin;window.openTrack=openTrack;window.start=start;window.answer=answer;window.logout=logout;render();
</script></body></html>
