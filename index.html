<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152f"><title>SkillsQuest</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f4f7fb;color:#091631}.app{max-width:540px;margin:auto;min-height:100vh}.hero{background:linear-gradient(145deg,#07152f,#1456c7);color:white;padding:24px 20px 28px;border-radius:0 0 28px 28px}.brand{font-weight:900;font-size:21px}.hero h1{font-size:32px;line-height:1.05;margin:30px 0 8px}.hero p{color:#d6e5ff}.stats{display:flex;gap:8px}.stat{flex:1;background:#ffffff16;border:1px solid #ffffff25;border-radius:14px;padding:11px}.stat b{display:block}.stat small{color:#c5d9ff}.content{padding:18px}.title{display:flex;justify-content:space-between;align-items:center}.tracks{display:grid;grid-template-columns:1fr 1fr;gap:12px}.track{background:white;border:1px solid #e2e8f2;border-radius:17px;padding:15px;text-align:left;min-height:125px;box-shadow:0 5px 18px #11285008}.track b{display:block;margin-top:9px}.track small{color:#65738c;display:block;margin-top:5px}.xp{color:#1265ed;font-weight:800}.screen{padding:20px}.back{padding:9px 12px;border:1px solid #dce4ef;background:white;border-radius:11px}.bar{height:8px;background:#e5ebf4;border-radius:9px;margin:18px 0}.fill{height:100%;background:linear-gradient(90deg,#1769ff,#27d8ff);border-radius:9px}.q{font-size:23px}.answers{display:grid;gap:10px}.answer{padding:15px;border:1px solid #dce4ef;background:white;border-radius:14px;text-align:left;font-weight:700}.ok{background:#edfcf6!important;border-color:#20bb82!important}.no{background:#fff3f3!important;border-color:#ff8d8d!important}.primary{width:100%;padding:15px;border:0;border-radius:14px;background:#1769ff;color:white;font-weight:800;margin-top:14px}.nav{position:sticky;bottom:0;background:#fffffff2;border-top:1px solid #e2e8f2;display:grid;grid-template-columns:repeat(4,1fr);padding:8px}.nav button{border:0;background:none;color:#66738c}.nav .on{color:#1769ff;font-weight:800}.leader{background:white;border-radius:17px;overflow:hidden;border:1px solid #e2e8f2}.tabs{display:flex;background:#eef3f9;padding:6px}.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-size:11px}.tabs .on{background:white;color:#1769ff;font-weight:800}.row{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid #e7ecf3}.row main{flex:1}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e8f0ff;color:#1769ff;font-weight:900}.profile{background:linear-gradient(145deg,#07152f,#1456c7);color:white;border-radius:20px;padding:22px}.share{width:100%;padding:12px;border:0;border-radius:12px;background:white;color:#1769ff;font-weight:800}.roles{margin-top:18px}.role-card{background:#f8fafc;border:1px solid #dce4ef;border-radius:14px;padding:14px;margin-top:10px}.role-card h3{margin:0 0 5px;font-size:16px}.role-card p{margin:5px 0;color:#4b5563;font-size:13px;line-height:1.45}.role-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.role-tag{background:#e8f0ff;color:#1769ff;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:700}.career{font-weight:700;color:#1769ff!important}</style></head><body><div id="app"></div><script>const tracks=[['🤖','AI'],['🛡️','Cybersecurity'],['📊','Data Analytics'],['☁️','Cloud'],['📋','Project Management'],['🚀','Career & Leadership'],['🌱','Sustainability'],['💡','Entrepreneurship']];let xp=1240,page='home',track=0,q=0;function nav(){return '<nav class=nav><button onclick="home()" class=on>⌂<br>Home</button><button onclick="start(0)">⚡<br>Sprint</button><button onclick="ranks()">🏆<br>Ranks</button><button onclick="profile()">◉<br>Profile</button></nav>'}function home(){page='home';app.innerHTML='<div class=hero><div class=brand>⚡ SkillsQuest</div><h1>Build skills.<br>Show progress.</h1><p>Interactive learning sprint for fresh working adults in Singapore.</p><div class=stats><div class=stat><b>'+xp+'</b><small>XP</small></div><div class=stat><b>Level 7</b><small>Explorer</small></div><div class=stat><b>🔥 7</b><small>Day streak</small></div></div></div><main class=content><div class=title><h2>Choose a skill sprint</h2><small>5 questions</small></div><div class=tracks>'+tracks.map((t,i)=>'<button class=track onclick="start('+i+')"><span style="font-size:27px">'+t[0]+'</span><b>'+t[1]+'</b><small>Build practical confidence</small><small class=xp>+250 XP</small></button>').join('')+'</div></main>'+nav()}const roleData={"AI":["AI Analyst / AI Specialist","Support teams in applying AI tools, analysing business problems and identifying opportunities to automate or improve workflows.","AI fundamentals, prompt engineering, data analysis, problem solving","Junior AI Analyst → AI Specialist → AI Consultant"],"Cybersecurity":["Cybersecurity Analyst","Monitor systems, identify security risks, investigate incidents and help protect company data and applications.","Security fundamentals, threat awareness, networking, risk management","Security Analyst → Cybersecurity Specialist → Security Consultant"],"Data Analytics":["Data Analyst","Analyse business data, build dashboards, identify trends and turn them into insights for better decisions.","Excel, SQL, data visualisation, statistics","Data Analyst → Business Analyst → Data Scientist"],"Cloud":["Cloud Support / Cloud Analyst","Help teams use cloud platforms, monitor environments and support reliable, scalable digital services.","Cloud fundamentals, networking, troubleshooting, automation","Cloud Support Associate → Cloud Engineer → Cloud Architect"],"Project Management":["Project Coordinator / Project Manager","Coordinate tasks, timelines and stakeholders to keep projects organised and deliver outcomes on schedule.","Planning, communication, risk management, collaboration","Project Coordinator → Project Manager → Programme Manager"],"Career & Leadership":["People / Leadership Development Specialist","Support employee development, engagement and leadership initiatives across an organisation.","Communication, coaching, stakeholder management, facilitation","HR / L&D Associate → Talent Specialist → HR Business Partner"],"Sustainability":["Sustainability Analyst","Collect and analyse sustainability data, support ESG initiatives and help organisations improve environmental and social performance.","ESG fundamentals, data analysis, reporting, stakeholder engagement","Sustainability Analyst → ESG Specialist → Sustainability Manager"],"Entrepreneurship":["Business Development / Startup Associate","Identify customer needs, develop business opportunities and support growth initiatives in a startup or new venture.","Market research, sales, business modelling, communication","Startup Associate → Business Development Manager → Entrepreneur"]};function roles(i){const t=tracks[i][1],d=roleData[t];app.innerHTML='<main class="screen"><button class="back" onclick="home()">← Back</button><div class="title"><h2>'+tracks[i][0]+' '+t+'</h2><small>Career connection</small></div><div class="roles"><div class="role-card"><h3>💼 '+d[0]+'</h3><p><b>Job Scope</b><br>'+d[1]+'</p><p><b>Key Skills</b></p><div class="role-tags">'+d[2].split(', ').map(x=>'<span class="role-tag">'+x+'</span>').join('')+'</div><p class="career">🚀 Career Path: '+d[3]+'</p></div></div><button class="primary" onclick="start('+i+')">Start '+t+' Sprint</button></main>'+nav()}function start(i){track=i;q=0;app.innerHTML=sprint()}function sprint(){return '<main class=screen><button class=back onclick="home()">← Back</button><p>'+tracks[track][0]+' '+tracks[track][1]+' • Question '+(q+1)+' of 5</p><div class=bar><div class=fill style="width:'+((q+1)*20)+'%"></div></div><h1 class=q>What is a good way to make progress on a new skill?</h1><div class=answers><button class=answer onclick="answer(this,true)">Set a small, focused goal</button><button class=answer onclick="answer(this,false)">Wait until you have more time</button><button class=answer onclick="answer(this,false)">Skip the activity</button><button class=answer onclick="answer(this,false)">Do something unrelated</button></div><div id=fb></div></main>'}function answer(el,ok){if(document.querySelector('.ok,.no'))return;el.classList.add(ok?'ok':'no');if(ok)xp+=50;fb.innerHTML='<p>'+ (ok?'✓ Correct! +50 XP':'Not quite — try focusing on a small action.')+'</p><button class=primary onclick="next()">'+(q===4?'Finish Sprint':'Next Question →')+'</button>'}function next(){if(q===4)profile();else{q++;app.innerHTML=sprint()}}function ranks(){app.innerHTML='<main class=screen><h1>🏆 Leaderboard</h1><p>Weekly</p><div class=leader>'+['Maya','Darren','Aisha','You','Ethan'].map((n,i)=>'<div class=row><b>'+(i+1)+'</b><div class=avatar>'+n[0]+'</div><main><b>'+n+'</b><br><small>Learner</small></main><b>'+(1590-i*70+(n==='You'?xp-1240:0))+' XP</b></div>').join('')+'</div></main>'+nav()}function profile(){app.innerHTML='<main class=screen><div class=profile><small>SKILLSQUEST PROFILE</small><h2>Darren Lee</h2><p>Junior Marketing Executive • Singapore</p><h1>'+xp+' XP</h1><button class=share onclick="navigator.share?navigator.share({title:&#39;SkillsQuest badge&#39;,text:&#39;I completed a SkillsQuest sprint!&#39;}):alert(&#39;Badge ready to share!&#39;)">↗ Share badge to LinkedIn</button></div><h2>Badges</h2><div class=tracks><div class=track>⚡<b>First Sprint</b><small>Started your journey</small></div><div class=track>🔥<b>7-Day Streak</b><small>Learning habit</small></div><div class=track>🤖<b>AI Explorer</b><small>AI sprint</small></div><div class=track>🏆<b>Challenge Ready</b><small>Join cohort challenge</small></div></div></main>'+nav()}home();</script></body></html>
