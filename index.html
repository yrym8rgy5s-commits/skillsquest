<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<title>SkillsQuest</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07152f;color:#fff}button,input{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding:22px 18px 90px}.brand{font-size:28px;font-weight:800}.muted{color:#aebbd4}.hero{padding:42px 0 24px}.hero h1{font-size:42px;line-height:1.05;margin:8px 0 14px}.hero p{font-size:17px;line-height:1.55;color:#c6d1e5}.card{background:#102347;border:1px solid #284064;border-radius:20px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.track{padding:16px;border-radius:16px;background:#132a50;border:1px solid #29466d;min-height:115px}.track b{display:block;margin:7px 0}.btn{border:0;border-radius:13px;padding:14px 18px;font-weight:700;background:#4f8cff;color:#fff}.btn.alt{background:#20395f}.btn.full{width:100%;margin-top:12px}.input{width:100%;padding:14px;margin:7px 0;background:#091a37;color:#fff;border:1px solid #345176;border-radius:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#081a36;border-top:1px solid #294064;display:flex;justify-content:center;gap:28px;padding:12px}.nav button{background:none;border:0;color:#b8c5db}.nav button.active{color:#fff;font-weight:700}.pill{display:inline-block;padding:6px 10px;background:#19365f;border-radius:99px;color:#bcd5ff;font-size:13px}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border-radius:13px;border:1px solid #345176;background:#10284d;color:#fff}.option.selected{border-color:#6ea1ff;background:#18396c}.hidden{display:none}.score{font-size:42px;font-weight:800}
@media(max-width:520px){.grid{grid-template-columns:1fr}.hero h1{font-size:38px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="nav" class="nav hidden"></div>
<script>
(function(){
"use strict";
var tracks=[
["AI","🤖","AI & Automation","AI Product / Automation Analyst",["Generative AI","Prompt engineering","Process automation","Data privacy","Measuring AI value"],[
["What is generative AI mainly used for?","Creating new text, images or code","Repairing hardware","Managing payroll","Installing Wi-Fi"],0],
["Which skill helps you get better results from an AI model?","Prompt engineering","Typing faster","Graphic printing","Office seating"],0],
["Before using company data with an AI tool, what should you check?","Privacy and security requirements","Lunch menu","Office temperature","Printer ink"],0],
["A useful way to assess an AI project is to ask whether it...","Creates measurable business value","Uses the newest logo","Has the longest report","Has the most slides"],0],
["Which task is well suited to automation?","A repetitive rule-based workflow","A sensitive conversation requiring judgement","A surprise party","A team photo"],0]]],
["Cybersecurity","🔐","Cybersecurity","Cybersecurity Analyst",["Threat awareness","MFA","Incident response","Security updates","Risk management"],[
["What is MFA designed to provide?","More than one way to verify identity","Faster internet","More storage","Better screen quality"],0],
["What should you do after discovering a suspected security incident?","Report and follow the incident-response process","Ignore it","Post it publicly","Delete all evidence"],0],
["Why are software security updates important?","They can fix known vulnerabilities","They make screens brighter","They reduce meetings","They change job titles"],0],
["Which is a common cybersecurity risk?","Phishing","Office plants","Calendar colours","Desk height"],0],
["Good security awareness includes...","Recognising suspicious links and requests","Sharing passwords","Disabling MFA","Using the same password everywhere"],0]]],
["Data Analytics","📊","Data Analytics","Data Analyst",["Excel","SQL","Dashboards","Data quality","Visualisation"],[
["Which tool is commonly used for spreadsheet analysis?","Excel","Paint","Calculator only","Music player"],0],
["What does SQL commonly help analysts do?","Query data","Design posters","Record videos","Manage office keys"],0],
["Why should missing data be checked?","It can affect the accuracy of analysis","It changes font size","It improves Wi-Fi","It creates passwords"],0],
["A dashboard is useful because it can...","Present key metrics visually","Replace every employee","Encrypt a laptop","Print receipts"],0],
["Good data visualisation should...","Make important patterns easier to understand","Hide unusual results","Use as many charts as possible","Avoid labels"],0]]],
["Cloud","☁️","Cloud Computing","Cloud Support / Cloud Analyst",["Cloud concepts","Troubleshooting","Monitoring","Networking","Automation"],[
["Cloud computing generally provides...","Computing resources over a network","Only physical filing cabinets","Paper-only reports","Offline-only software"],0],
["If a cloud service stops responding, a useful first step is to...","Check service status, logs and connectivity","Delete the project","Ignore the alert","Change everyone's password"],0],
["What does monitoring help a cloud team do?","Track system health and performance","Design business cards","Schedule birthdays","Write contracts"],0],
["Networking knowledge helps cloud professionals understand...","How systems communicate","How to cook","How to print posters","How to plan holidays"],0],
["Automation in cloud operations can help...","Reduce repetitive manual tasks","Remove all security controls","Eliminate testing","Hide system errors"],0]]],
["Project Management","📋","Project Management","Project Coordinator / Manager",["Planning","Scheduling","Stakeholders","Risk","Communication"],[
["A project manager is primarily responsible for...","Coordinating scope, time, resources and stakeholders","Writing every line of code","Approving all leave","Managing office catering"],0],
["If a key task is delayed, the team should first...","Assess impact and update the plan","Hide the delay","Cancel the project immediately","Blame one person"],0],
["Stakeholder management involves...","Understanding needs and communicating appropriately","Avoiding stakeholders","Only sending invoices","Choosing office furniture"],0],
["A project risk is...","An uncertain event that could affect objectives","A completed task","A meeting room","A job title"],0],
["Clear project communication helps teams...","Stay aligned on progress and actions","Avoid documentation","Increase confusion","Remove accountability"],0]]],
["Human Resources","👥","Human Resources","HR / Talent Management Specialist",["Talent management","People analytics","Employee development","Communication","Engagement"],[
["What is a core HR responsibility?","Supporting people and workforce processes","Designing network routers","Auditing code","Building servers"],0],
["People analytics uses data to...","Understand workforce trends and support decisions","Replace every interview","Create passwords","Design logos"],0],
["Talent management can include...","Development and succession planning","Only payroll printing","Office cleaning","IT hardware repair"],0],
["Employee development focuses on...","Building skills and capabilities","Reducing all training","Deleting feedback","Avoiding career discussions"],0],
["Effective HR communication should be...","Clear, respectful and appropriate to the audience","Secretive","Identical for every situation","Only verbal"],0]]],
["Finance","💰","Finance","Financial Analyst",["Financial analysis","Budgeting","Profitability","Excel","Cost analysis"],[
["Financial analysis often involves...","Interpreting financial data for decisions","Designing websites","Repairing laptops","Planning office parties"],0],
["A budget helps an organisation...","Plan and control expected income and spending","Guarantee profit","Avoid all costs","Remove financial reporting"],0],
["Profit is broadly calculated as...","Revenue minus costs","Costs minus revenue","Revenue plus all costs","Assets minus employees"],0],
["Excel is useful in finance for...","Calculations, modelling and analysis","Replacing all accounting standards","Managing Wi-Fi","Creating security badges"],0],
["A cost comparison should consider...","Relevant costs and expected benefits","Only the biggest number","Only the oldest price","Office colour"],0]]],
["Sustainability","🌱","Sustainability","Sustainability Analyst",["ESG","KPIs","Reporting","Data analysis","Resource efficiency"],[
["ESG commonly stands for...","Environmental, Social and Governance","Employee Sales Growth","Economic Software Guide","Energy Systems Group"],0],
["A sustainability KPI is used to...","Measure progress against a sustainability objective","Replace all financial KPIs","Choose office furniture","Set passwords"],0],
["Sustainability reporting can help organisations...","Communicate performance and progress","Avoid measurement","Remove accountability","Stop collecting data"],0],
["Data analysis can support sustainability by...","Identifying trends in resource use and emissions","Deleting records","Replacing policies","Removing targets"],0],
["Resource efficiency means...","Achieving outcomes with less waste or resource use","Using more resources regardless of need","Avoiding measurement","Buying the most expensive option"],0]]],
["Entrepreneurship","🚀","Entrepreneurship","Business / Startup Associate",["Customer discovery","Market research","Business models","Pitching","Validation"],[
["A strong business idea should start with...","A real customer problem or need","A logo","An office","A company name"],0],
["Market research helps founders...","Understand customers and competitors","Guarantee success","Avoid customers","Set employee passwords"],0],
["A business model explains...","How a business creates and captures value","Only its logo","Only its office location","Only its social media"],0],
["A pitch should communicate...","The problem, solution, value and evidence","Only the founder's biography","Only the logo","Only the company history"],0],
["Validation means...","Testing assumptions with evidence from users or the market","Assuming customers agree","Skipping research","Avoiding feedback"],0]]],
["Career & Leadership","⭐","Career & Leadership","Leadership / Learning Specialist",["Leadership","Facilitation","Feedback","Coaching","Engagement"],[
["Good leadership includes...","Setting direction and supporting people","Doing every task alone","Avoiding feedback","Keeping goals unclear"],0],
["Constructive feedback should be...","Specific, respectful and actionable","Personal and vague","Delayed forever","Only negative"],0],
["Coaching is mainly about...","Helping someone develop through questions and support","Giving every answer immediately","Avoiding goals","Replacing training"],0],
["Facilitation helps a group...","Work together toward a clear outcome","Avoid discussion","Choose a leader randomly","Skip decisions"],0],
["Employee engagement can improve when people...","Understand purpose and feel able to contribute","Never receive feedback","Have unclear expectations","Avoid communication"],0]]]
];
var state={page:"home",user:localStorage.getItem("sq_user")||"",track:null,q:0,score:0,selected:null};

function save(){localStorage.setItem("sq_user",state.user)}
function render(){
var a=document.getElementById("app"), n=document.getElementById("nav");
n.className=state.user?"nav":"nav hidden";
if(state.user)n.innerHTML='<button class="'+(state.page==="home"?"active":"")+'" onclick="goHome()">Home</button><button class="'+(state.page==="explore"?"active":"")+'" onclick="explore()">Explore</button><button class="'+(state.page==="profile"?"active":"")+'" onclick="profile()">Profile</button>';
if(!state.user){auth(a);return}
if(state.page==="home")home(a);else if(state.page==="explore")explorePage(a);else if(state.page==="profile")profilePage(a);else trackPage(a);}

function auth(a){
a.innerHTML='<div class="hero"><div class="brand">⚡ SkillsQuest</div><h1>Build skills.<br>Find your career.</h1><p>A gamified IBM SkillsBuild onboarding sprint for fresh working adults.</p></div><div class="card"><h2>Get started</h2><input id="name" class="input" placeholder="Your name"><input id="email" class="input" type="email" placeholder="Email"><input id="pw" class="input" type="password" placeholder="Password"><button class="btn full" onclick="signup()">Create account</button><button class="btn alt full" onclick="signin()">Sign in</button></div>'}

function signup(){var name=document.getElementById("name").value.trim();if(!name){alert("Please enter your name.");return}state.user=name;save();state.page="home";render()}
function signin(){var name=document.getElementById("name").value.trim()||"SkillsQuest User";state.user=name;save();state.page="home";render()}
function goHome(){state.page="home";render()} function explore(){state.page="explore";render()} function profile(){state.page="profile";render()}
function home(a){a.innerHTML='<div class="hero"><span class="pill">Welcome, '+esc(state.user)+'</span><h1>Build skills.<br>Find your career.</h1><p>Choose a career track and complete a 5-question sprint to earn XP.</p><button class="btn" onclick="explore()">Explore tracks →</button></div><div class="card"><b>⚡ Your mission</b><p class="muted">Explore a role, test your knowledge, and build confidence in skills employers value.</p></div><h2>Popular tracks</h2><div class="grid">'+tracks.slice(0,4).map(card).join("")+'</div>'}
function explorePage(a){a.innerHTML='<h1>Explore tracks</h1><p class="muted">10 career pathways. Pick one to begin.</p><div class="grid">'+tracks.map(card).join("")+'</div>'}
function card(t,i){return '<div class="track" onclick="openTrack('+i+')"><span style="font-size:26px">'+t[1]+'</span><b>'+t[0]+'</b><span class="muted">'+t[2]+'</span></div>'}
function openTrack(i){state.track=i;state.page="track";render()}
function trackPage(a){var t=tracks[state.track];a.innerHTML='<button class="btn alt" onclick="explore()">← Back</button><div class="hero" style="padding-top:24px"><span style="font-size:42px">'+t[1]+'</span><h1>'+t[0]+'</h1><p>'+t[2]+'</p></div><div class="card"><span class="pill">Job role</span><h2>'+t[3]+'</h2><p><b>Key skills</b></p><p class="muted">'+t[4].join(" · ")+'</p><button class="btn full" onclick="startQuiz()">Start 5-question sprint →</button></div>'}
function startQuiz(){state.q=0;state.score=0;state.selected=null;quiz()}
function quiz(){var a=document.getElementById("app"),t=tracks[state.track],qq=t[5][state.q];a.innerHTML='<div class="card"><span class="pill">Question '+(state.q+1)+' of 5</span><h2>'+qq[0]+'</h2>'+qq[1]+'<div id="opts">'+qq.slice(1,5).map(function(x,i){return '<button class="option" onclick="answer('+i+')">'+x+'</button>'}).join("")+'</div></div>'}
function answer(i){var t=tracks[state.track],qq=t[5][state.q];if(state.selected!==null)return;state.selected=i;var opts=document.querySelectorAll(".option");opts[i].classList.add("selected");if(i===qq[5])state.score++;setTimeout(function(){state.q++;state.selected=null;if(state.q<5)quiz();else finish()},350)}
function finish(){var a=document.getElementById("app"),xp=state.score*50;a.innerHTML='<div class="hero"><span class="pill">Sprint complete</span><h1>Nice work, '+esc(state.user)+'!</h1><div class="score">'+state.score+'/5</div><p>You earned <b>'+xp+' XP</b>.</p><button class="btn full" onclick="explore()">Try another track</button><button class="btn alt full" onclick="profile()">View profile</button></div>'}
function profilePage(a){a.innerHTML='<h1>Profile</h1><div class="card"><span class="pill">Demo profile</span><h2>'+esc(state.user)+'</h2><p class="muted">SkillsQuest learner</p><h3>⚡ XP</h3><p>250 XP available in this demo</p><h3>🏅 Badges</h3><p>Explorer · First Sprint</p><button class="btn alt full" onclick="logout()">Sign out</button></div>'}
function logout(){state.user="";localStorage.removeItem("sq_user");state.page="home";render()}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
window.goHome=goHome;window.explore=explore;window.profile=profile;window.signup=signup;window.signin=signin;window.openTrack=openTrack;window.startQuiz=startQuiz;window.answer=answer;window.logout=logout;render();
})();
</script>
</body>
</html>
