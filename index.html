<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<title>SkillsQuest</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#091631}.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}.screen{min-height:100vh;padding:22px 18px 90px}.hero{background:linear-gradient(145deg,#07152f,#1456c7);color:#fff;padding:28px 22px;border-radius:0 0 28px 28px}.brand{font-weight:900;font-size:22px}.hero h1{font-size:34px;line-height:1.05;margin:30px 0 10px}.muted{color:#64748b;font-size:14px;line-height:1.5}.hero .muted{color:#dbe7ff}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:#1769ff;color:white}.secondary{background:#eef4ff;color:#1769ff}.white{background:white;color:#1769ff;margin-top:16px}.row{display:flex;gap:10px}.row .btn{flex:1}.section{padding:20px 18px}.section h2{font-size:21px;margin:0 0 5px}.input{width:100%;padding:14px;border:1px solid #dbe3ef;border-radius:12px;margin:7px 0 12px;font-size:15px}.auth{padding:30px 22px}.auth h1{font-size:30px}.back{border:0;background:none;padding:0;font-size:14px;font-weight:700;color:#1769ff;margin-bottom:25px}.tabs{display:flex;background:#eef2f7;border-radius:12px;padding:4px;margin:18px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font-weight:700}.tabs .active{background:#fff;box-shadow:0 1px 5px #ccd3df}.trackgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.track{border:1px solid #e1e7ef;background:#fff;border-radius:16px;padding:16px;text-align:left;min-height:135px;cursor:pointer;box-shadow:0 3px 14px #1228500d}.icon{font-size:26px}.track b{display:block;margin-top:10px}.track small{display:block;color:#64748b;margin-top:5px;line-height:1.35}.badge{display:inline-block;background:#eaf1ff;color:#1769ff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.role{background:#f8fafc;border:1px solid #e1e7ef;border-radius:16px;padding:17px;margin-top:16px}.role h3{margin:0 0 7px}.role p{font-size:13px;line-height:1.5;color:#475569}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#eaf1ff;color:#1769ff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;background:#fff;border-top:1px solid #e5eaf1;display:flex;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;border:0;background:none;font-size:11px;color:#64748b}.nav b{display:block;font-size:18px;margin-bottom:2px}.xp{background:#07152f;color:#fff;border-radius:16px;padding:16px;margin-top:16px}.q{border:1px solid #e1e7ef;border-radius:14px;padding:15px;margin:10px 0;cursor:pointer}.correct{background:#ecfdf5;border-color:#22c55e}.wrong{background:#fff1f2;border-color:#fb7185}.center{text-align:center;padding-top:70px}.link{color:#1769ff;font-weight:700;border:0;background:none}.error{color:#dc2626;font-size:13px;min-height:18px}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
const tracks=[
["🤖","AI","AI tools & automation","AI Analyst / AI Specialist","Support teams in applying AI tools, analysing business problems and improving workflows.","AI fundamentals, prompt engineering, data analysis, problem solving","Junior AI Analyst → AI Specialist → AI Consultant"],
["🔐","Cybersecurity","Protect digital systems","Cybersecurity Analyst","Monitor systems, identify security risks, investigate incidents and protect company data.","Security fundamentals, threat awareness, networking, risk management","Security Analyst → Cybersecurity Specialist → Security Consultant"],
["📊","Data Analytics","Turn data into insights","Data Analyst","Analyse business data, build dashboards, identify trends and support better decisions.","Excel, SQL, data visualisation, statistics","Data Analyst → Business Analyst → Data Scientist"],
["☁️","Cloud","Build & support cloud services","Cloud Support / Cloud Analyst","Support cloud environments, monitor services and help teams deliver reliable digital solutions.","Cloud fundamentals, networking, troubleshooting, automation","Cloud Support Associate → Cloud Engineer → Cloud Architect"],
["📋","Project Management","Deliver projects effectively","Project Coordinator / Project Manager","Coordinate tasks, timelines and stakeholders to keep projects organised and on schedule.","Planning, communication, risk management, collaboration","Project Coordinator → Project Manager → Programme Manager"],
["👥","Human Resources","Build better workplaces","HR / Talent Management Specialist","Support recruitment, employee development, engagement, talent programmes and people analytics.","Communication, HR fundamentals, data analysis, stakeholder management","HR Associate → Talent Specialist → HR Business Partner"],
["💰","Finance","Understand business & money","Finance Analyst","Analyse financial information, prepare reports, support budgeting and help teams make informed business decisions.","Financial analysis, Excel, accounting basics, data visualisation","Finance Analyst → Senior Analyst → Finance Manager"],
["🌱","Sustainability","Create responsible growth","Sustainability Analyst","Analyse sustainability data, support ESG initiatives and help organisations improve environmental and social performance.","ESG fundamentals, data analysis, reporting, stakeholder engagement","Sustainability Analyst → ESG Specialist → Sustainability Manager"],
["🚀","Entrepreneurship","Build & grow ventures","Business Development / Startup Associate","Identify customer needs, develop business opportunities and support growth initiatives.","Market research, sales, business modelling, communication","Startup Associate → Business Development Manager → Entrepreneur"],
["⭐","Career & Leadership","Grow workplace impact","Leadership Development Specialist","Support employee development, engagement and leadership initiatives across an organisation.","Communication, coaching, stakeholder management, facilitation","L&D Associate → Talent Specialist → HR Business Partner"]
];
const questions=["Which skill is most relevant to this career path?","Which activity is closest to this job scope?","What would help you perform this role effectively?","Which outcome would show progress in this career?","Which skill would you like to develop next?"];
let user=JSON.parse(localStorage.getItem("sqUser")||"null"),xp=Number(localStorage.getItem("sqXP")||0),current=0;
function save(){localStorage.setItem("sqUser",JSON.stringify(user));localStorage.setItem("sqXP",xp)}
function nav(){return '<nav class="nav"><button onclick="home()"><b>⌂</b>Home</button><button onclick="explore()"><b>◎</b>Explore</button><button onclick="profile()"><b>◉</b>Profile</button></nav>'}
function auth(mode){app.innerHTML='<main class="screen auth"><button class="back" onclick="home()">← Back</button><span class="badge">SkillsQuest</span><h1>'+(mode==="signup"?"Create your account":"Welcome back")+'</h1><p class="muted">'+(mode==="signup"?"Build your skills and discover career paths that fit you.":"Sign in to continue your learning journey.")+'</p><label>Name</label><input id="name" class="input" placeholder="Your name" '+(mode==="signin"?'value="'+(user?.name||"")+'"':'')+'><label>Email</label><input id="email" class="input" type="email" placeholder="you@example.com"><label>Password</label><input id="pass" class="input" type="password" placeholder="••••••••"><div id="err" class="error"></div><button class="btn primary" onclick="submitAuth(''+mode+'')">'+(mode==="signup"?"Create account":"Sign in")+'</button><p class="muted center" style="padding-top:18px">'+(mode==="signup"?'Already have an account?':'New to SkillsQuest?')+' <button class="link" onclick="auth(''+(mode==="signup"?"signin":"signup")+'')">'+(mode==="signup"?"Sign in":"Create account")+'</button></p></main>'}
function submitAuth(mode){const n=document.getElementById("name").value.trim(),e=document.getElementById("email").value.trim(),p=document.getElementById("pass").value;if(!e||!p||(mode==="signup"&&!n)){document.getElementById("err").textContent="Please complete all required fields.";return}user={name:n||e.split("@")[0],email:e};save();home()}
function landing(){app.innerHTML='<main class="screen"><section class="hero"><div class="brand">⚡ SkillsQuest</div><h1>Build skills.<br>Find your career.</h1><p class="muted">Explore real job roles, understand the skills employers look for, and complete short learning sprints.</p><button class="btn white" onclick="auth(\'signup\')">Create free account</button><button class="btn" style="background:transparent;color:#fff;border:1px solid #ffffff55;margin-top:10px" onclick="auth(\'signin\')">Sign in</button></section><section class="section"><h2>Why SkillsQuest?</h2><p class="muted">Connect what you learn with where it can take you — from Finance and HR to AI, Data, Cloud and more.</p><div class="xp"><b>💡 Career-first learning</b><br><span style="font-size:13px;color:#cbd5e1">Learn the job scope first, then test your knowledge with a 5-question sprint.</span></div></section></main>'}
function home(){if(!user){landing();return}app.innerHTML='<main class="screen"><div class="title"><span class="badge">WELCOME BACK</span><h2 style="margin-bottom:4px">Hi, '+user.name+' 👋</h2><p class="muted">What career path do you want to explore?</p></div><div class="xp"><b>⚡ '+xp+' XP</b><br><span style="font-size:12px;color:#cbd5e1">Keep learning to build your profile.</span></div><h3 style="margin-top:25px">Explore tracks</h3><div class="trackgrid">'+tracks.map((t,i)=>'<button class="track" onclick="track('+i+')"><span class="icon">'+t[0]+'</span><b>'+t[1]+'</b><small>'+t[2]+'</small></button>').join("")+'</div></main>'+nav()}
function explore(){home()}
function track(i){current=i;const t=tracks[i];app.innerHTML='<main class="screen"><button class="back" onclick="home()">← Back</button><span class="badge">'+t[1]+'</span><h2>'+t[0]+' '+t[1]+'</h2><p class="muted">'+t[2]+'</p><div class="role"><h3>💼 '+t[3]+'</h3><p><b>Job Scope</b><br>'+t[4]+'</p><p><b>Key Skills</b></p><div class="tags">'+t[5].split(", ").map(x=>'<span class="tag">'+x+'</span>').join("")+'</div><p><b>🚀 Career Path</b><br>'+t[6]+'</p></div><button class="btn primary" style="margin-top:16px" onclick="start()">Start 5-question sprint</button></main>'+nav()}
function start(){let q=0;function render(){app.innerHTML='<main class="screen"><button class="back" onclick="track('+current+')">← Track</button><span class="badge">'+tracks[current][1]+' SPRINT</span><h2>Question '+(q+1)+' of 5</h2><p>'+questions[q]+'</p><div class="q" onclick="answer(this,true)">Learn more about the role</div><div class="q" onclick="answer(this,false)">Skip all career information</div><div class="q" onclick="answer(this,true)">Practise a relevant skill</div><div class="q" onclick="answer(this,false)">Ignore the job requirements</div></main>'+nav()}window.answer=function(el,ok){el.classList.add(ok?"correct":"wrong");if(ok)xp+=50;setTimeout(()=>{q++;if(q<5)render();else{save();done()}},350)};render()}
function done(){app.innerHTML='<main class="screen center"><div style="font-size:60px">🎉</div><h1>Sprint complete!</h1><p class="muted">You earned 250 XP from the '+tracks[current][1]+' track.</p><div class="xp"><b>Total XP: '+xp+'</b></div><button class="btn primary" style="margin-top:20px" onclick="track('+current+')">Explore this career</button><button class="btn secondary" style="margin-top:10px" onclick="home()">Back to home</button></main>'+nav()}
function profile(){if(!user){auth("signin");return}app.innerHTML='<main class="screen"><button class="back" onclick="home()">← Back</button><span class="badge">PROFILE</span><h2>'+user.name+'</h2><p class="muted">'+user.email+'</p><div class="xp"><b>⚡ '+xp+' XP</b><br><span style="font-size:12px;color:#cbd5e1">SkillsQuest learner</span></div><div class="role"><h3>🏅 Badges</h3><p>Complete tracks to unlock career badges and build your profile.</p><div class="tags"><span class="tag">New Explorer</span><span class="tag">Career Curious</span></div></div><button class="btn secondary" style="margin-top:16px" onclick="logout()">Sign out</button></main>'+nav()}
function logout(){user=null;save();landing()}
home();
</script></body></html>
