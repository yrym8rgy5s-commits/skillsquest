<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152f"><title>SkillsQuest</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#091631}.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}.screen{min-height:100vh;padding:22px 18px 90px}.hero{background:linear-gradient(145deg,#07152f,#1456c7);color:#fff;padding:28px 22px;border-radius:0 0 28px 28px}.brand{font-weight:900;font-size:22px}.hero h1{font-size:34px;line-height:1.05;margin:30px 0 10px}.muted{color:#64748b;font-size:14px;line-height:1.5}.hero .muted{color:#dbe7ff}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:#1769ff;color:white}.secondary{background:#eef4ff;color:#1769ff}.white{background:white;color:#1769ff;margin-top:16px}.input{width:100%;padding:14px;border:1px solid #dbe3ef;border-radius:12px;margin:7px 0 12px;font-size:15px}.auth{padding:30px 22px}.auth h1{font-size:30px}.back{border:0;background:none;padding:0;font-size:14px;font-weight:700;color:#1769ff;margin-bottom:25px}.trackgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.track{border:1px solid #e1e7ef;background:#fff;border-radius:16px;padding:16px;text-align:left;min-height:135px;cursor:pointer;box-shadow:0 3px 14px #1228500d}.icon{font-size:26px}.track b{display:block;margin-top:10px}.track small{display:block;color:#64748b;margin-top:5px;line-height:1.35}.badge{display:inline-block;background:#eaf1ff;color:#1769ff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.role{background:#f8fafc;border:1px solid #e1e7ef;border-radius:16px;padding:17px;margin-top:16px}.role h3{margin:0 0 7px}.role p{font-size:13px;line-height:1.5;color:#475569}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#eaf1ff;color:#1769ff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;background:#fff;border-top:1px solid #e5eaf1;display:flex;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav button{flex:1;border:0;background:none;font-size:11px;color:#64748b}.nav b{display:block;font-size:18px;margin-bottom:2px}.xp{background:#07152f;color:#fff;border-radius:16px;padding:16px;margin-top:16px}.q{border:1px solid #e1e7ef;border-radius:14px;padding:15px;margin:10px 0;cursor:pointer}.q:hover{border-color:#1769ff}.correct{background:#ecfdf5;border-color:#22c55e}.wrong{background:#fff1f2;border-color:#fb7185}.center{text-align:center;padding-top:70px}.link{color:#1769ff;font-weight:700;border:0;background:none}.error{color:#dc2626;font-size:13px;min-height:18px}
</style></head><body><div class="app" id="app"></div><script>
const tracks=[
["🤖","AI","AI tools & automation","AI Analyst / AI Specialist","Support teams in applying AI tools, analysing business problems and improving workflows.","AI fundamentals, prompt engineering, data analysis, problem solving","Junior AI Analyst → AI Specialist → AI Consultant"],
["🔐","Cybersecurity","Protect digital systems","Cybersecurity Analyst","Monitor systems, identify security risks, investigate incidents and protect company data.","Security fundamentals, threat awareness, networking, risk management","Security Analyst → Cybersecurity Specialist → Security Consultant"],
["📊","Data Analytics","Turn data into insights","Data Analyst","Analyse business data, build dashboards, identify trends and support better decisions.","Excel, SQL, data visualisation, statistics","Data Analyst → Business Analyst → Data Scientist"],
["☁️","Cloud","Build & support cloud services","Cloud Support / Cloud Analyst","Support cloud environments, monitor services and help teams deliver reliable digital solutions.","Cloud fundamentals, networking, troubleshooting, automation","Cloud Support Associate → Cloud Engineer → Cloud Architect"],
["📋","Project Management","Deliver projects effectively","Project Coordinator / Project Manager","Coordinate tasks, timelines and stakeholders to keep projects organised and on schedule.","Planning, communication, risk management, collaboration","Project Coordinator → Project Manager → Programme Manager"],
["👥","Human Resources","Build better workplaces","HR / Talent Management Specialist","Support recruitment, employee development, engagement, talent programmes and people analytics.","Communication, HR fundamentals, data analysis, stakeholder management","HR Associate → Talent Specialist → HR Business Partner"],
["💰","Finance","Understand business & money","Finance Analyst","Analyse financial information, prepare reports, support budgeting and help teams make informed business decisions.","Financial analysis, Excel, accounting basics, data visualisation","Finance Analyst → Senior Analyst → Finance Manager"],
["🌱","Sustainability","Create responsible growth","Sustainability Analyst","Analyse sustainability data, support ESG initiatives and help organisations improve environmental and social performance.","ESG fundamentals, data analysis, reporting, stakeholder engagement","Sustainability Analyst → ESG Specialist → Sustainability Manager"],
["🚀","Entrepreneurship","Build & grow ventures","Business Development / Startup Associate","Identify customer needs, develop business opportunities and support growth initiatives.","Market research, sales, business modelling, communication","Startup Associate → Business Development Manager → Entrepreneur"],
["⭐","Career & Leadership","Grow workplace impact","Leadership Development Specialist","Support employee development, engagement and leadership initiatives across an organisation.","Communication, coaching, stakeholder management, facilitation","L&D Associate → Talent Specialist → HR Business Partner"]
];
const quizzes=[
[
["What is a common use of generative AI in the workplace?",["Drafting and summarising content","Replacing every employee","Removing all data checks","Guaranteeing perfect decisions"]],
["Which skill helps an AI analyst improve prompts?",["Prompt engineering","Payroll processing","Warehouse packing","Graphic printing"]],
["A team wants to automate a repetitive task. What should you do first?",["Understand the process and problem","Deploy a model immediately","Ignore the current workflow","Buy random software"]],
["What should an AI analyst consider before using company data?",["Data privacy and security","Only the font colour","Office seating","Employee birthdays"]],
["Which outcome best shows AI project value?",["A measurable improvement in time, quality or cost","More meetings","More files created","A longer email"]]
],
[
["What is the main purpose of cybersecurity?",["Protect systems, data and users","Increase social media followers","Design logos","Manage office catering"]],
["Which practice reduces account compromise?",["Multi-factor authentication","Sharing passwords","Using the same password everywhere","Disabling updates"]],
["What should an analyst do after detecting suspicious activity?",["Investigate and follow the incident process","Ignore it","Post it publicly","Delete all logs"]],
["Why are software updates important?",["They can fix known security vulnerabilities","They make laptops heavier","They remove all passwords","They guarantee zero attacks"]],
["Which skill is useful for a cybersecurity analyst?",["Threat awareness","Event decoration","Food preparation","Video editing"]]
],
[
["Which tool is commonly used to analyse spreadsheet data?",["Excel","Paint","Calculator only","Camera"]],
["What does SQL help an analyst do?",["Query data","Design uniforms","Send parcels","Edit photos"]],
["A dashboard is most useful for:",["Communicating trends and KPIs","Replacing all meetings","Writing contracts","Storing passwords"]],
["What should you do when data contains missing values?",["Investigate and handle them appropriately","Always delete the entire dataset","Pretend they are zero","Publish immediately"]],
["Which skill helps turn numbers into business recommendations?",["Data visualisation and critical thinking","Typing speed only","Graphic design only","Public speaking only"]]
],
[
["What is cloud computing?",["Using computing resources over a network","Only storing files on a USB","Printing documents","Buying office furniture"]],
["Which issue might a cloud support analyst troubleshoot?",["A service connectivity problem","A broken chair","A catering menu","A business card design"]],
["Why is monitoring cloud services important?",["To identify performance or availability issues","To choose office colours","To schedule birthdays","To create invoices only"]],
["Which skill is useful in cloud support?",["Networking fundamentals","Cooking","Photography","Copywriting only"]],
["What does automation help cloud teams do?",["Reduce repetitive manual tasks","Remove all security controls","Guarantee zero downtime","Eliminate documentation"]]
],
[
["What is a project manager responsible for?",["Coordinating scope, schedule, people and risks","Writing every line of code","Managing only office snacks","Designing company logos"]],
["Why use a project timeline?",["To track tasks and deadlines","To replace communication","To remove stakeholders","To guarantee no changes"]],
["What should a project coordinator do when a task is delayed?",["Communicate the impact and help update the plan","Hide the delay","Delete the task","Blame someone immediately"]],
["Which is an example of stakeholder management?",["Keeping relevant people informed and aligned","Ignoring feedback","Avoiding meetings forever","Changing requirements secretly"]],
["Which skill is especially important in project work?",["Communication","Speed typing only","Drawing","Cooking"]]
],
[
["What is a key responsibility of HR?",["Supporting people and organisational needs","Managing only IT servers","Designing buildings","Trading stocks for employees"]],
["What does talent management focus on?",["Attracting, developing and retaining talent","Selling office equipment","Repairing laptops","Managing delivery routes"]],
["Why is people analytics useful?",["It helps HR identify workforce trends and insights","It replaces every HR conversation","It guarantees promotions","It removes the need for managers"]],
["Which activity supports employee development?",["Learning and development programmes","Deleting performance records","Ignoring career goals","Removing feedback"]],
["Which skill is valuable for an HR specialist?",["Stakeholder communication","Network cabling","Food preparation","Video gaming"]]
],
[
["What does a finance analyst commonly analyse?",["Financial performance and business data","Office furniture","Social media memes","Building security cameras"]],
["Which statement best describes a budget?",["A plan for expected income and spending","A list of employee birthdays","A cybersecurity alert","A marketing slogan"]],
["Which metric can help assess profitability?",["Profit margin","Number of meetings","Office temperature","Email length"]],
["Why is Excel useful in finance?",["It supports calculations, analysis and financial models","It replaces accounting knowledge","It guarantees profits","It prevents all errors automatically"]],
["A manager asks whether costs are rising. What should you compare?",["Current costs with prior periods or budget","Only the company logo","Employee names","Office locations"]]
],
[
["What does ESG commonly stand for?",["Environmental, Social and Governance","Employee Sales Growth","Economic Stock Guidance","Enterprise Security Gateway"]],
["What might a sustainability analyst track?",["Emissions and sustainability KPIs","Only sales calls","Office passwords","Website colours"]],
["Why is sustainability reporting important?",["It communicates relevant environmental and social performance","It guarantees no environmental impact","It replaces financial statements","It is only for decoration"]],
["Which skill helps analyse ESG performance?",["Data analysis","Cooking","Video gaming","Interior design"]],
["What is one way a company can improve sustainability?",["Reduce resource use and measure progress","Stop measuring anything","Hide emissions data","Ignore suppliers"]]
],
[
["What is a key activity in entrepreneurship?",["Identifying customer problems and opportunities","Avoiding customers","Copying every competitor","Ignoring costs"]],
["Why is market research useful?",["It helps understand customers and competitors","It guarantees success","It replaces product testing","It eliminates all risk"]],
["What does a business model explain?",["How a venture creates, delivers and captures value","Only the company logo","Employee lunch choices","Office seating"]],
["Which skill helps a startup communicate its idea?",["Pitching and storytelling","Typing only","Accounting only","Coding only"]],
["What should a founder validate early?",["Whether a real customer problem exists","Only the colour of the website","The office location only","Employee uniforms"]]
],
[
["What is a leadership development programme designed to support?",["Employee and leadership growth","IT hardware repairs","Office construction","Inventory shipping"]],
["Which skill is important when facilitating a workshop?",["Communication and facilitation","Accounting only","Coding only","Photography only"]],
["Why is feedback useful for leaders?",["It provides information for improvement","It guarantees promotion","It removes responsibility","It replaces performance goals"]],
["What does coaching generally help an employee do?",["Develop capability and reflect on improvement","Avoid all challenges","Skip learning","Remove goals"]],
["Which activity supports employee engagement?",["Meaningful communication and development opportunities","Ignoring employee feedback","Reducing communication","Removing recognition"]]
]
];
let user=JSON.parse(localStorage.getItem("sqUser")||"null"),xp=Number(localStorage.getItem("sqXP")||0),current=0;
function save(){localStorage.setItem("sqUser",JSON.stringify(user));localStorage.setItem("sqXP",xp)}
function nav(){return '<nav class="nav"><button onclick="home()"><b>⌂</b>Home</button><button onclick="home()"><b>◎</b>Explore</button><button onclick="profile()"><b>◉</b>Profile</button></nav>'}
function auth(mode){app.innerHTML='<main class="screen auth"><button class="back" onclick="home()">← Back</button><span class="badge">SkillsQuest</span><h1>'+(mode==="signup"?"Create your account":"Welcome back")+'</h1><p class="muted">'+(mode==="signup"?"Build your skills and discover career paths that fit you.":"Sign in to continue your learning journey.")+'</p><label>Name</label><input id="name" class="input" placeholder="Your name"><label>Email</label><input id="email" class="input" type="email" placeholder="you@example.com"><label>Password</label><input id="pass" class="input" type="password" placeholder="••••••••"><div id="err" class="error"></div><button class="btn primary" onclick="submitAuth(''+mode+'')">'+(mode==="signup"?"Create account":"Sign in")+'</button><p class="muted center" style="padding-top:18px">'+(mode==="signup"?'Already have an account?':'New to SkillsQuest?')+' <button class="link" onclick="auth(''+(mode==="signup"?"signin":"signup")+'')">'+(mode==="signup"?"Sign in":"Create account")+'</button></p></main>'}
function submitAuth(mode){let n=document.getElementById("name").value.trim(),e=document.getElementById("email").value.trim(),p=document.getElementById("pass").value;if(!e||!p||(mode==="signup"&&!n)){document.getElementById("err").textContent="Please complete all required fields.";return}user={name:n||e.split("@")[0],email:e};save();home()}
function landing(){app.innerHTML='<main class="screen"><section class="hero"><div class="brand">⚡ SkillsQuest</div><h1>Build skills.<br>Find your career.</h1><p class="muted">Explore real job roles, understand the skills employers look for, and complete short learning sprints.</p><button class="btn white" onclick="auth(\'signup\')">Create free account</button><button class="btn" style="background:transparent;color:#fff;border:1px solid #ffffff55;margin-top:10px" onclick="auth(\'signin\')">Sign in</button></section><section class="screen" style="min-height:auto;padding:25px 0 0"><h2>Career tracks</h2><p class="muted">Finance, HR, AI, Data, Cybersecurity, Cloud and more.</p></section></main>'}
function home(){if(!user){landing();return}app.innerHTML='<main class="screen"><span class="badge">WELCOME BACK</span><h2>Hi, '+user.name+' 👋</h2><p class="muted">Choose a career track and test yourself with questions written for that field.</p><div class="xp"><b>⚡ '+xp+' XP</b><br><span style="font-size:12px;color:#cbd5e1">Each correct answer earns 50 XP.</span></div><h3 style="margin-top:25px">Explore tracks</h3><div class="trackgrid">'+tracks.map((t,i)=>'<button class="track" onclick="track('+i+')"><span class="icon">'+t[0]+'</span><b>'+t[1]+'</b><small>'+t[2]+'</small></button>').join("")+'</div></main>'+nav()}
function track(i){current=i;let t=tracks[i];app.innerHTML='<main class="screen"><button class="back" onclick="home()">← Back</button><span class="badge">'+t[1]+'</span><h2>'+t[0]+' '+t[1]+'</h2><p class="muted">'+t[2]+'</p><div class="role"><h3>💼 '+t[3]+'</h3><p><b>Job Scope</b><br>'+t[4]+'</p><p><b>Key Skills</b></p><div class="tags">'+t[5].split(", ").map(x=>'<span class="tag">'+x+'</span>').join("")+'</div><p><b>🚀 Career Path</b><br>'+t[6]+'</p></div><button class="btn primary" style="margin-top:16px" onclick="start()">Start 5-question sprint</button></main>'+nav()}
function start(){let q=0,score=0;function render(){let item=quizzes[current][q];let opts=item[1].map((x,i)=>'<div class="q" onclick="answer('+i+',this)">'+x+'</div>').join("");app.innerHTML='<main class="screen"><button class="back" onclick="track('+current+')">← Track</button><span class="badge">'+tracks[current][1]+' SPRINT</span><h2>Question '+(q+1)+' of 5</h2><p style="font-weight:700">'+item[0]+'</p>'+opts+'<p class="muted">Choose the answer you think is correct.</p></main>'+nav()}window.answer=function(i,el){let correct=i===0;el.classList.add(correct?"correct":"wrong");if(correct){xp+=50;score++}document.querySelectorAll(".q").forEach(x=>x.style.pointerEvents="none");setTimeout(()=>{q++;if(q<5)render();else{save();done(score)}},500)};render()}
function done(score){app.innerHTML='<main class="screen center"><div style="font-size:60px">🎉</div><h1>Sprint complete!</h1><p class="muted">You scored '+score+'/5 in '+tracks[current][1]+'.</p><div class="xp"><b>+ '+(score*50)+' XP</b><br><span style="font-size:12px;color:#cbd5e1">Total XP: '+xp+'</span></div><button class="btn primary" style="margin-top:20px" onclick="track('+current+')">Review career</button><button class="btn secondary" style="margin-top:10px" onclick="home()">Choose another track</button></main>'+nav()}
function profile(){if(!user){auth("signin");return}app.innerHTML='<main class="screen"><button class="back" onclick="home()">← Back</button><span class="badge">PROFILE</span><h2>'+user.name+'</h2><p class="muted">'+user.email+'</p><div class="xp"><b>⚡ '+xp+' XP</b><br><span style="font-size:12px;color:#cbd5e1">SkillsQuest learner</span></div><div class="role"><h3>🏅 Badges</h3><p>Complete career tracks to build your SkillsQuest profile.</p><div class="tags"><span class="tag">New Explorer</span><span class="tag">Career Curious</span></div></div><button class="btn secondary" style="margin-top:16px" onclick="logout()">Sign out</button></main>'+nav()}
function logout(){user=null;save();landing()}home();
</script></body></html>
